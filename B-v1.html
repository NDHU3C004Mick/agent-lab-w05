<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f1">
  <title>課間我想做什麼？</title>
  <style>
    :root { color-scheme: light; --ink:#20352e; --muted:#5d7168; --green:#28664e; --green-dark:#1d503c; --paper:#fffefa; --line:#d8e2d9; --mint:#edf5ed; --gold:#f2c66d; --shadow:0 16px 42px rgba(32,53,46,.09); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:32px 18px 48px; color:var(--ink); background:radial-gradient(ellipse at 85% 0%,#e5efdf 0,transparent 38%),#f4f7f1; font-family:ui-rounded,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; }
    .wrap { max-width:820px; margin:0 auto; }
    header { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:22px; }
    .eyebrow { margin:0 0 8px; color:var(--green); font-size:.8rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(2rem,6vw,3.25rem); letter-spacing:-.045em; line-height:1.12; }
    .subtitle { margin:12px 0 0; color:var(--muted); }
    button,select { font:inherit; }
    button { cursor:pointer; }
    .language { flex:none; border:1px solid var(--line); border-radius:999px; padding:9px 14px; color:var(--green-dark); background:var(--paper); font-weight:750; }
    .notice { margin:20px 0 18px; border:1px solid #e5d7ad; border-radius:13px; padding:11px 14px; color:#635326; background:#fff9e8; font-size:.9rem; font-weight:700; }
    .panel { border:1px solid var(--line); border-radius:22px; padding:clamp(18px,4vw,30px); background:var(--paper); box-shadow:var(--shadow); }
    .filters { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
    .field label { display:block; margin:0 0 7px; font-size:.9rem; font-weight:800; }
    select { width:100%; min-height:48px; border:1px solid #cbd8ce; border-radius:12px; padding:10px 38px 10px 12px; color:var(--ink); background:#fff; }
    select:focus-visible,button:focus-visible { outline:3px solid #e7b849; outline-offset:3px; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; }
    .primary,.secondary,.clear { border-radius:12px; padding:12px 18px; font-weight:800; }
    .primary { border:0; color:white; background:var(--green); box-shadow:0 5px 12px rgba(40,102,78,.18); }
    .primary:hover { background:var(--green-dark); }
    .secondary,.clear { border:1px solid var(--line); color:var(--green-dark); background:white; }
    .secondary:hover,.clear:hover,.language:hover { background:var(--mint); }
    .result { margin-top:20px; min-height:82px; }
    .result-card { border-radius:16px; padding:20px; background:var(--mint); animation:appear .2s ease-out; }
    .result-card h2 { margin:0 0 12px; font-size:1.45rem; }
    .result-id { display:inline-block; margin-bottom:9px; color:var(--green); font-size:.8rem; font-weight:850; letter-spacing:.08em; }
    .tags { display:flex; flex-wrap:wrap; gap:8px; }
    .tag { border:1px solid #d6e4d8; border-radius:999px; padding:6px 10px; color:#405e4e; background:#fff; font-size:.86rem; }
    .empty { border:1px dashed #d7c48e; border-radius:14px; padding:18px; color:#6d5924; background:#fff9e8; font-weight:800; }
    .history { margin-top:26px; }
    .history-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
    .history h2 { margin:0; font-size:1.1rem; }
    .clear { padding:8px 12px; font-size:.86rem; }
    .history-list { display:grid; gap:8px; padding:0; margin:0; list-style:none; }
    .history-item { display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:12px; padding:11px 13px; background:white; }
    .history-id { flex:none; min-width:38px; color:var(--green); font-size:.79rem; font-weight:850; }
    .history-name { flex:1; }
    .history-time { color:var(--muted); font-size:.87rem; white-space:nowrap; }
    .history-empty { margin:0; color:var(--muted); font-size:.92rem; }
    footer { margin-top:18px; color:var(--muted); text-align:center; font-size:.82rem; }
    @keyframes appear { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
    @media (max-width:600px) { body { padding:22px 13px 36px; } header { align-items:center; } .filters { grid-template-columns:1fr; gap:12px; } .actions { display:grid; grid-template-columns:1fr 1fr; } .primary { grid-column:1 / -1; min-height:50px; } .secondary { min-height:46px; } .panel { border-radius:18px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; scroll-behavior:auto!important; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <p class="eyebrow" data-i18n="eyebrow">一點點空檔，做點喜歡的事</p>
        <h1 data-i18n="title">課間我想做什麼？</h1>
        <p class="subtitle" data-i18n="subtitle">選好條件，讓下一個小活動自己出現。</p>
      </div>
      <button class="language" id="languageButton" type="button" aria-label="Switch language">EN</button>
    </header>
    <div class="notice" data-i18n="notice">教學模擬活動，不是校方公告</div>
    <section class="panel" aria-label="Activity picker">
      <div class="filters">
        <div class="field">
          <label for="location" data-i18n="locationLabel">地點</label>
          <select id="location"><option value="all" data-i18n="locationAll">不限地點</option><option value="indoor" data-i18n="indoor" selected>室內</option><option value="outdoor" data-i18n="outdoor">室外</option></select>
        </div>
        <div class="field">
          <label for="duration" data-i18n="durationLabel">可用時間</label>
          <select id="duration"><option value="15" selected>15 分鐘</option><option value="30">30 分鐘</option><option value="60">60 分鐘</option></select>
        </div>
        <div class="field">
          <label for="energy" data-i18n="energyLabel">活動強度</label>
          <select id="energy"><option value="all" data-i18n="energyAll">不限強度</option><option value="low" data-i18n="low" selected>低強度</option><option value="medium" data-i18n="medium">中強度</option></select>
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="pickButton" type="button" data-i18n="pick">幫我選</button>
        <button class="secondary" id="resetButton" type="button" data-i18n="reset">重設篩選</button>
      </div>
      <div class="result" id="result" aria-live="polite" aria-atomic="true"></div>
      <section class="history" aria-labelledby="historyTitle">
        <div class="history-head"><h2 id="historyTitle" data-i18n="historyTitle">最近抽選</h2><button class="clear" id="clearButton" type="button" data-i18n="clear">清除紀錄</button></div>
        <ol class="history-list" id="historyList"></ol>
      </section>
    </section>
    <footer data-i18n="footer">活動資料僅供課堂練習參考。</footer>
  </main>
  <script>
    'use strict';
    const activities = [
      {id:'A01',name_zh:'整理書包',name_en:'Organize your bag',location_type:'indoor',minutes:10,energy:'low'},
      {id:'A02',name_zh:'畫一張小卡',name_en:'Draw a small card',location_type:'indoor',minutes:15,energy:'low'},
      {id:'A03',name_zh:'寫三句讀書筆記',name_en:'Write three study notes',location_type:'indoor',minutes:10,energy:'low'},
      {id:'A04',name_zh:'安靜讀兩頁書',name_en:'Read two pages quietly',location_type:'indoor',minutes:15,energy:'low'},
      {id:'A05',name_zh:'排好明日待辦',name_en:'Plan tomorrow’s tasks',location_type:'indoor',minutes:20,energy:'low'},
      {id:'A06',name_zh:'整理本機練習檔',name_en:'Organize practice files',location_type:'indoor',minutes:30,energy:'medium'},
      {id:'A07',name_zh:'在合適位置慢走',name_en:'Take a gentle walk in a suitable area',location_type:'outdoor',minutes:15,energy:'low'},
      {id:'A08',name_zh:'觀察天空並畫草圖',name_en:'Observe the sky and sketch',location_type:'outdoor',minutes:20,energy:'low'},
      {id:'A09',name_zh:'在合適位置快走',name_en:'Take a brisk walk in a suitable area',location_type:'outdoor',minutes:30,energy:'medium'},
      {id:'A10',name_zh:'規劃小組練習',name_en:'Plan a group exercise',location_type:'indoor',minutes:45,energy:'medium'},
      {id:'A11',name_zh:'記錄自然色彩',name_en:'Record colors in nature',location_type:'outdoor',minutes:45,energy:'low'},
      {id:'A12',name_zh:'構思下一次社團活動',name_en:'Brainstorm a future club activity',location_type:'indoor',minutes:60,energy:'medium'}
    ];
    const messages = {
      zh:{eyebrow:'一點點空檔，做點喜歡的事',title:'課間我想做什麼？',subtitle:'選好條件，讓下一個小活動自己出現。',notice:'教學模擬活動，不是校方公告',locationLabel:'地點',locationAll:'不限地點',indoor:'室內',outdoor:'室外',durationLabel:'可用時間',minutes:'分鐘',energyLabel:'活動強度',energyAll:'不限強度',low:'低強度',medium:'中強度',pick:'幫我選',reset:'重設篩選',historyTitle:'最近抽選',clear:'清除紀錄',historyEmpty:'成功抽選後，最近 5 次會顯示在這裡。',noMatch:'沒有符合條件的活動',timeUnit:'分鐘',placeLabel:'地點',energyName:'強度',footer:'活動資料僅供課堂練習參考。'},
      en:{eyebrow:'A little break, a little something you enjoy',title:'What should I do between classes?',subtitle:'Choose your filters and find a small activity.',notice:'Teaching simulation, not an official school announcement',locationLabel:'Location',locationAll:'Any location',indoor:'Indoor',outdoor:'Outdoor',durationLabel:'Available time',minutes:'min',energyLabel:'Activity intensity',energyAll:'Any intensity',low:'Low',medium:'Medium',pick:'Pick for me',reset:'Reset filters',historyTitle:'Recent picks',clear:'Clear history',historyEmpty:'Your 5 most recent successful picks will appear here.',noMatch:'No activities match your filters.',timeUnit:'min',placeLabel:'Location',energyName:'Intensity',footer:'Activities are for classroom practice only.'}
    };
    let language = 'zh';
    let history = [];
    let lastPick = null;
    const $ = (id) => document.getElementById(id);
    const t = (key) => messages[language][key];
    function nameOf(activity) { return activity[language === 'zh' ? 'name_zh' : 'name_en']; }
    function translateStatic() {
      document.documentElement.lang = language === 'zh' ? 'zh-Hant' : 'en';
      document.querySelectorAll('[data-i18n]').forEach((element) => {
        const key = element.dataset.i18n;
        if (messages[language][key]) element.textContent = messages[language][key];
      });
      $('languageButton').textContent = language === 'zh' ? 'EN' : '中文';
      $('languageButton').setAttribute('aria-label', language === 'zh' ? 'Switch to English' : '切換為中文');
      $('duration').querySelectorAll('option').forEach((option) => {
        option.textContent = `${option.value} ${t('minutes')}`;
      });
      renderResult();
      renderHistory();
    }
    function renderResult() {
      const area = $('result');
      if (lastPick === 'empty') {
        area.innerHTML = `<div class="empty" role="status">${t('noMatch')}</div>`;
        return;
      }
      if (!lastPick) { area.replaceChildren(); return; }
      const a = lastPick;
      area.innerHTML = `<article class="result-card"><span class="result-id">${a.id}</span><h2>${nameOf(a)}</h2><div class="tags"><span class="tag">${a.minutes} ${t('timeUnit')}</span><span class="tag">${t(a.location_type)}</span><span class="tag">${t(a.energy)}</span></div></article>`;
    }
    function renderHistory() {
      const list = $('historyList');
      list.replaceChildren();
      if (!history.length) {
        const empty = document.createElement('li'); empty.className = 'history-empty'; empty.textContent = t('historyEmpty'); list.append(empty); return;
      }
      history.forEach((a) => {
        const item = document.createElement('li'); item.className = 'history-item';
        const id = document.createElement('span'); id.className = 'history-id'; id.textContent = a.id;
        const name = document.createElement('span'); name.className = 'history-name'; name.textContent = nameOf(a);
        const time = document.createElement('span'); time.className = 'history-time'; time.textContent = `${a.minutes} ${t('timeUnit')}`;
        item.append(id,name,time); list.append(item);
      });
    }
    function pickActivity() {
      const location = $('location').value;
      const maximumMinutes = Number($('duration').value);
      const energy = $('energy').value;
      const matches = activities.filter((a) => (location === 'all' || a.location_type === location) && a.minutes <= maximumMinutes && (energy === 'all' || a.energy === energy));
      if (!matches.length) { lastPick = 'empty'; renderResult(); return; }
      const selected = matches[Math.floor(Math.random() * matches.length)];
      lastPick = selected;
      history.unshift(selected);
      history = history.slice(0,5);
      renderResult(); renderHistory();
    }
    $('pickButton').addEventListener('click',pickActivity);
    $('resetButton').addEventListener('click',() => { $('location').value='all'; $('duration').value='30'; $('energy').value='all'; lastPick=null; renderResult(); });
    $('clearButton').addEventListener('click',() => { history=[]; renderHistory(); });
    $('languageButton').addEventListener('click',() => { language=language==='zh'?'en':'zh'; translateStatic(); });
    translateStatic();
  </script>
</body>
</html>
